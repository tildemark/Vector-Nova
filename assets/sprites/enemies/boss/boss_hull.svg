<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160">
  <defs>
    <linearGradient id="hullArmor" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="coreGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
    <filter id="dreadGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Massive Heavy Wings / Pylons -->
  <polygon points="190,10 70,25 25,60 55,80 25,100 70,135 190,150 160,80" fill="#090d16" stroke="#e11d48" stroke-width="2.5"/>
  <!-- Armored Hull Plates -->
  <polygon points="205,30 90,40 50,70 50,90 90,120 205,130 175,80" fill="url(#hullArmor)" stroke="#f43f5e" stroke-width="2"/>
  <!-- Mechanical Armor Ribs -->
  <line x1="120" y1="42" x2="140" y2="70" stroke="#f43f5e" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="118" x2="140" y2="90" stroke="#f43f5e" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="45" x2="165" y2="72" stroke="#f43f5e" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="115" x2="165" y2="88" stroke="#f43f5e" stroke-width="2" opacity="0.6"/>
  <!-- Central Exposed Reactor Bay -->
  <polygon points="95,80 75,65 55,80 75,95" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
  <!-- Exposed Core Reactor (Pulsing Energy Eye) -->
  <circle cx="75" cy="80" r="14" fill="url(#coreGlowGrad)" filter="url(#dreadGlow)"/>
  <circle cx="75" cy="80" r="6" fill="#ffffff"/>
  <!-- Heavy Capital Thruster Engines -->
  <rect x="195" y="45" width="20" height="18" rx="4" fill="#fb923c"/>
  <rect x="200" y="71" width="16" height="18" rx="4" fill="#ef4444"/>
  <rect x="195" y="97" width="20" height="18" rx="4" fill="#fb923c"/>
</svg>
