<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 56" width="88" height="56">
  <defs>
    <linearGradient id="intGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="intGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Armored Heavy Wings -->
  <polygon points="76,4 32,10 12,28 32,46 76,52 64,28" fill="#1c1917" stroke="#f97316" stroke-width="2"/>
  <!-- Armor Plating -->
  <polygon points="70,12 36,16 20,28 36,40 70,44 54,28" fill="url(#intGrad)" stroke="#fde047" stroke-width="1.5"/>
  <!-- Dual Heavy Plasma Barrels -->
  <rect x="8" y="16" width="22" height="5" rx="2" fill="#ef4444"/>
  <rect x="8" y="35" width="22" height="5" rx="2" fill="#ef4444"/>
  <rect x="6" y="17" width="8" height="3" rx="1.5" fill="#fde047" filter="url(#intGlow)"/>
  <rect x="6" y="36" width="8" height="3" rx="1.5" fill="#fde047" filter="url(#intGlow)"/>
  <!-- Central Cockpit Visor -->
  <polygon points="40,28 26,24 16,28 26,32" fill="#fde047" filter="url(#intGlow)"/>
  <!-- Twin Exhaust -->
  <rect x="74" y="18" width="6" height="6" rx="2" fill="#fb923c"/>
  <rect x="74" y="32" width="6" height="6" rx="2" fill="#fb923c"/>
</svg>
