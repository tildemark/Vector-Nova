<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="missileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="missileGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Reticle Border -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.85"/>
  <circle cx="32" cy="32" r="23" fill="#7c2d12" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1.2"/>
  <!-- Twin Swarm Rockets -->
  <!-- Left Missile -->
  <path d="M 24 16 L 27 22 L 27 38 L 22 44 L 25 44 L 27 41 L 29 44 L 32 44 L 27 38 L 27 22 Z" fill="url(#missileGrad)" filter="url(#missileGlow)" transform="rotate(-15 26 32)"/>
  <!-- Right Missile -->
  <path d="M 40 16 L 43 22 L 43 38 L 38 44 L 41 44 L 43 41 L 45 44 L 48 44 L 43 38 L 43 22 Z" fill="url(#missileGrad)" filter="url(#missileGlow)" transform="rotate(15 38 32)"/>
  <!-- Crosshair ticks -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="#fbbf24" stroke-width="2"/>
  <line x1="32" y1="52" x2="32" y2="58" stroke="#fbbf24" stroke-width="2"/>
  <line x1="6" y1="32" x2="12" y2="32" stroke="#fbbf24" stroke-width="2"/>
  <line x1="52" y1="32" x2="58" y2="32" stroke="#fbbf24" stroke-width="2"/>
</svg>
