<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="empGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="empGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Shockwave Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="8 4" opacity="0.8"/>
  <circle cx="32" cy="32" r="23" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Central Lightning Bolt EMP Burst -->
  <polygon points="34,8 18,34 32,34 28,56 46,26 32,26" fill="url(#empGrad)" filter="url(#empGlow)"/>
</svg>
