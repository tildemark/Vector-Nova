<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 240" width="80" height="240">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cautionStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Structural Steel Girder Frame -->
  <rect x="10" y="0" width="60" height="240" fill="url(#beamGrad)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Cross Truss Bracing -->
  <line x1="10" y1="0" x2="70" y2="60" stroke="#0f172a" stroke-width="3"/>
  <line x1="70" y1="0" x2="10" y2="60" stroke="#0f172a" stroke-width="3"/>
  <line x1="10" y1="60" x2="70" y2="120" stroke="#0f172a" stroke-width="3"/>
  <line x1="70" y1="60" x2="10" y2="120" stroke="#0f172a" stroke-width="3"/>
  <line x1="10" y1="120" x2="70" y2="180" stroke="#0f172a" stroke-width="3"/>
  <line x1="70" y1="120" x2="10" y2="180" stroke="#0f172a" stroke-width="3"/>
  <line x1="10" y1="180" x2="70" y2="240" stroke="#0f172a" stroke-width="3"/>
  <line x1="70" y1="180" x2="10" y2="240" stroke="#0f172a" stroke-width="3"/>
  <!-- Hazard Caution Stripes -->
  <rect x="14" y="10" width="52" height="14" fill="url(#cautionStripe)"/>
  <rect x="14" y="216" width="52" height="14" fill="url(#cautionStripe)"/>
</svg>
