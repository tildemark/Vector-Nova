<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="45%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="apexWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="apexGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Quantum Split Wings -->
  <polygon points="8,4 44,14 36,26 6,22" fill="url(#apexWings)" stroke="#a855f7" stroke-width="1.8"/>
  <polygon points="8,60 44,50 36,38 6,42" fill="url(#apexWings)" stroke="#a855f7" stroke-width="1.8"/>
  <!-- Wingtip Grav Emitters -->
  <circle cx="44" cy="14" r="4" fill="#38bdf8" filter="url(#apexGlow)"/>
  <circle cx="44" cy="50" r="4" fill="#38bdf8" filter="url(#apexGlow)"/>
  <!-- Forward Stealth Fuselage -->
  <polygon points="94,32 50,14 24,18 18,32 24,46 50,50" fill="url(#apexGrad)" stroke="#c084fc" stroke-width="2"/>
  <!-- Glowing Singularity Core Reactor -->
  <polygon points="74,32 58,26 48,32 58,38" fill="#38bdf8" filter="url(#apexGlow)"/>
  <circle cx="56" cy="32" r="3.5" fill="#ffffff" filter="url(#apexGlow)"/>
  <!-- Dark Matter Thruster Exhaust -->
  <rect x="12" y="27" width="6" height="10" rx="2" fill="#7e22ce"/>
</svg>
