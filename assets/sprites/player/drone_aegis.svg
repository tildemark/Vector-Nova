<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="aegisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shieldGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Energy Barrier Ring -->
  <circle cx="24" cy="24" r="21" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.85"/>
  <!-- Armored Hex Shield Chassis -->
  <polygon points="36,24 28,12 16,12 10,24 16,36 28,36" fill="url(#aegisGrad)" stroke="#a7f3d0" stroke-width="1.5"/>
  <!-- Point Defense Emitter Core -->
  <circle cx="24" cy="24" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.2" filter="url(#shieldGlow)"/>
</svg>
