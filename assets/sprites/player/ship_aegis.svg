<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <defs>
    <linearGradient id="aegisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="wingAegis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="aegisGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Crescent Shield Wings -->
  <path d="M 12 6 Q 52 16 38 32 Q 48 24 16 26 Z" fill="url(#wingAegis)" stroke="#34d399" stroke-width="1.8"/>
  <path d="M 12 58 Q 52 48 38 32 Q 48 40 16 38 Z" fill="url(#wingAegis)" stroke="#34d399" stroke-width="1.8"/>
  <!-- Defensive Matrix Emitter Rings -->
  <circle cx="48" cy="16" r="5" fill="#047857" stroke="#6ee7b7" stroke-width="1.5" filter="url(#aegisGlow)"/>
  <circle cx="48" cy="48" r="5" fill="#047857" stroke="#6ee7b7" stroke-width="1.5" filter="url(#aegisGlow)"/>
  <!-- Streamlined Core Fuselage -->
  <polygon points="86,32 40,16 22,24 26,32 22,40 40,48" fill="url(#aegisGrad)" stroke="#10b981" stroke-width="2"/>
  <!-- Matrix Hex Cockpit -->
  <polygon points="70,32 52,26 44,32 52,38" fill="#a7f3d0" filter="url(#aegisGlow)"/>
  <!-- Twin Plasma Emitters -->
  <rect x="18" y="27" width="6" height="10" rx="2" fill="#34d399"/>
</svg>
