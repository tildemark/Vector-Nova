<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <defs>
    <linearGradient id="valkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="wingValk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <filter id="valkGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Forward Swept Wings -->
  <polygon points="10,2 48,16 38,28 14,26" fill="url(#wingValk)" stroke="#fb7185" stroke-width="1.5"/>
  <polygon points="10,62 48,48 38,36 14,38" fill="url(#wingValk)" stroke="#fb7185" stroke-width="1.5"/>
  <!-- Needle Piercing Lance Cannon -->
  <polygon points="94,32 50,30 50,34" fill="#ffffff" filter="url(#valkGlow)"/>
  <!-- Sharp Aerodynamic Fuselage -->
  <polygon points="90,32 42,16 20,24 24,32 20,40 42,48" fill="url(#valkGrad)" stroke="#f43f5e" stroke-width="2"/>
  <!-- Cockpit Blade Canopy -->
  <polygon points="76,32 54,28 46,32 54,36" fill="#ffe4e6" filter="url(#valkGlow)"/>
  <!-- Plasma Thruster Ports -->
  <rect x="16" y="28" width="6" height="8" rx="1.5" fill="#f43f5e"/>
</svg>
