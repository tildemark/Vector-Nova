<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 10" width="36" height="10">
  <defs>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055ff" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#00d4ff"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f7ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Energy Capsule -->
  <rect x="2" y="1" width="32" height="8" rx="4" fill="url(#laserGrad)" filter="url(#glow)"/>
  <!-- Core Bright Stream -->
  <rect x="6" y="3" width="26" height="4" rx="2" fill="#ffffff"/>
</svg>
